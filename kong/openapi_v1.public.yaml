# A2C API -- OpenAPI 3.0.3 (PUBLIC / partner-facing contract)
# Same 94 routes and schemas as openapi_v1.yaml, with internal-only vendor extensions
# (x-legacy-rpc-method, x-schema-confidence) removed. Generated from generate_openapi_spec.py.
openapi: 3.0.3
info:
  title: OpenAgriNet Access to Credit (A2C) API
  version: 1.0.0
  description: 'REST API for the OpenAgriNet Access to Credit platform, covering bank onboarding, loan
    product cataloging, the farmer-facing marketplace, loan underwriting, Fayda national ID consent capture,
    and platform notifications.
    
    Response schemas are typed per operation from the platform''s documented request/response examples;
    a small number of endpoints without a documented example carry a schema inferred from the corresponding
    request shape -- see each schema''s own `description` field for a note where that applies.'
  contact:
    name: OpenAgriNet Support
    email: admin@openagrinet.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api.a2c.oanstaging.com
  description: Production
- url: https://api.staging.a2c.oanstaging.com
  description: Staging
tags:
- name: Identity & Access
  description: Registration, login, token lifecycle, and the caller's own profile.
- name: Bank Onboarding & Administration
  description: Bank registration, KYC, organizational profile, and team management.
- name: Bank Cataloging
  description: Loan product authoring, marketplace taxonomy, and pipeline configuration.
- name: Catalog Discovery
  description: Farmer-facing marketplace browsing.
- name: Applications (Farmer Self-Service)
  description: The farmer's own loan application draft and submission.
- name: CRM - Leads & Field Ops
  description: Lead capture, qualification, and field-visit scheduling (Development Agent).
- name: Loan Underwriting
  description: Bank-scoped loan application review and pipeline movement.
- name: Consent Management
  description: Fayda national ID consent capture and the inbound registry webhook.
- name: Notifications
  description: In-app notifications for the signed-in user.
- name: Inbound Webhooks
  description: Server-to-server receivers for external systems.
security:
- BearerAuth: []
