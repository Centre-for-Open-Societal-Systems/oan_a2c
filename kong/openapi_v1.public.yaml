components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by /v1/auth/login. The gateway validates signature and expiry
        only; role and bank-scope authorization are enforced by the platform.
    PartnerApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: `token <api_key>:<api_secret>`. Used only by the two inbound webhook receivers;
        issued per partner and paired with IP allowlisting at the gateway.'
  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Success
        data:
          type: object
          properties: {}
          description: Overridden per-operation via allOf; see the operation's response schema.
        meta:
          type: object
          properties: {}
          description: Auxiliary metadata.
        pagination:
          $ref: '#/components/schemas/Pagination'
        request_id:
          type: string
          format: uuid
      required:
      - status
      - message
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failed
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - AUTHENTICATION_ERROR
          - PERMISSION_DENIED
          - BANK_NOT_ACTIVE
          - BANK_NOT_ONBOARDED
          - PASSWORD_CHANGE_REQUIRED
          - NOT_FOUND
          - RATE_LIMITED
          - INTERNAL_ERROR
          - GENERIC_ERROR
        details:
          type: object
          properties: {}
          description: Field-level validation errors or context.
        request_id:
          type: string
          format: uuid
      required:
      - status
      - message
      - code
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5
        has_next:
          type: boolean
          example: true
      description: Present on paginated list responses; null otherwise.
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        full_name:
          minLength: 2
          title: Full Name
          type: string
        password:
          maxLength: 64
          minLength: 8
          title: Password
          type: string
        phone_number:
          title: Phone Number
          type: string
        role:
          default: A2C Bank Admin
          maxLength: 140
          minLength: 2
          title: Role
          type: string
      required:
      - full_name
      - password
      - phone_number
    LoginRequest:
      type: object
      properties:
        usr:
          minLength: 1
          title: Usr
          type: string
        pwd:
          minLength: 1
          title: Pwd
          type: string
        remember_me:
          default: false
          title: Remember Me
          type: boolean
      required:
      - usr
      - pwd
    TokenRefreshRequest:
      type: object
      properties:
        refresh_token:
          minLength: 1
          title: Refresh Token
          type: string
      required:
      - refresh_token
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          minLength: 1
          title: Refresh Token
          type: string
      required:
      - refresh_token
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        key:
          minLength: 1
          title: Key
          type: string
        new_password:
          minLength: 1
          title: New Password
          type: string
      required:
      - key
      - new_password
    InitialPasswordRequest:
      type: object
      properties:
        usr:
          minLength: 1
          title: Usr
          type: string
        current_password:
          minLength: 1
          title: Current Password
          type: string
        new_password:
          maxLength: 64
          minLength: 8
          title: New Password
          type: string
      required:
      - usr
      - current_password
      - new_password
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          minLength: 1
