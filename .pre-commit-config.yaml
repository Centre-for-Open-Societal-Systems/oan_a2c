exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "oan_a2c.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      # A file with no newline on its last line makes every append to it a
      # conflict, because both sides have to rewrite that line. .editorconfig
      # already asks for this; the hook is what enforces it. Doctype JSON is
      # excluded because Frappe writes those without a final newline.
      - id: end-of-file-fixer
        exclude: ".*json$|.*svg$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                oan_a2c/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                oan_a2c/templates/includes/.*|
                oan_a2c/public/js/lib/.*
            )$

      # Markdown too. docs/ is edited by nearly every feature branch, and the
      # conflicts it produces are mostly formatting drift — one branch pads its
      # tables and blank-lines its headings, the next one strips them, and then
      # any real edit nearby collides. One formatter, enforced in CI, removes
      # that whole class. Settings live in .prettierrc.
      - id: prettier
        name: "Run prettier on markdown"
        types_or: [markdown]
        exclude: |
            (?x)^(
                .*node_modules.*|
                .*boilerplate.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                oan_a2c/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                oan_a2c/templates/includes/.*|
                oan_a2c/public/js/lib/.*
            )$


ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
