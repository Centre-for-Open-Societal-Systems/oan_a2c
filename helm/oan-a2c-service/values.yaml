# Defaults for OAN A2C (Access to Credit). Everything sits under `frappe`, the values of the
# frappe chart this one depends on. Per-environment values live in
# environments/<env>/values/oan-a2c-service.yaml.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>` (locally: `develop`)
# - frappe.dbHost: the PostgreSQL server (set in the environment file)
# Image repositories, the seed image and dbRootUser are per environment.
# Secrets the chart generates once and keeps across upgrades (templates/secrets.yaml), see `secrets` below:
# - oan-a2c-admin (key `password`): Frappe Administrator password
# - oan-a2c-jwt (key `jwt_v1.pem`): RSA private key that signs access tokens
# - oan-a2c-secret-key (key `secret_key`): signs consent receipts
# Secrets created outside Git, in the release namespace:
# - oan-frappe-common-db (key `password`): the `postgres` password, copied from the frappe-common namespace
# - oan-a2c-sentry (key `dsn`): Sentry DSN. Optional.
# - oan-a2c-seed (key `password`): password for the demo users. Optional.
# - oan-a2c-openg2p-partner (keys `client_id`, `client_secret`, `username`, `password`): the A2C
#   partner client of the consent integration, see `openg2pPartnerSecret`. Optional.

# Set create=false to bring your own Secret with the same name and keys.
secrets:
  admin:
    create: true
    name: oan-a2c-admin
  secretKey:
    create: true
    name: oan-a2c-secret-key
  jwt:
    create: true
    name: oan-a2c-jwt

global:
  # Domain of the environment, e.g. development.oanstaging.com. iamServices builds its hosts from it.
  baseDomain: ""

# Login options of the A2C portal: one `OAN IAM Service` row each, written into the DB by the
# site-settings Job on every install and upgrade (templates/site-settings.yaml) and matched by `key`.
# Keys are the DocType's field names; default_roles is a list of role names. Values are templates.
# An environment that changes one entry repeats the whole list, as Helm replaces lists.
# Rows removed from the list stay in the DB. An empty list turns the Job off.
iamServices:
- key: agent
  label: Agent
  enabled: 1
  sort_order: 20
  base_url: "https://staff-iam.{{ .Values.global.baseDomain }}"
  provider_id: 1
  issuer: "https://keycloak.{{ .Values.global.baseDomain }}/realms/staff"
  client_id: staff-portal
  application: oan-client
- key: beneficiary
  label: National ID (eSignet)
  enabled: 1
  sort_order: 30
  base_url: "https://bene-iam.{{ .Values.global.baseDomain }}"
  provider_id: 11
  issuer: "https://esignet.{{ .Values.global.baseDomain }}"
  # eSignet tokens carry no client roles, and the DocType refuses a row with neither an application
  # nor a default role. Everyone who signs in with a national ID is a farmer.
  default_roles:
  - A2C Farmer

# Fields of `A2C OpenG2P Settings` (the consent integration), written into the DB by the same Job.
# Field names are the DocType's; values are templates. Empty values are skipped, so the DB keeps
# what it has. Fields left out keep their DocType default or desk value.
openg2pSettings:
  keycloak_url: "https://keycloak.{{ .Values.global.baseDomain }}"
  consent_manager_url: "https://consent-manager.{{ .Values.global.baseDomain }}"
  aggregation_url: "https://aggregation.{{ .Values.global.baseDomain }}"
  agent_api_url: "https://staff-farmer.{{ .Values.global.baseDomain }}"
  # Must equal the partner_id claim of the partner token.
  partner_id: A2C Service

# Secret with the credentials of the A2C partner client in the `partner` Keycloak realm, registered
# by hand once per environment. Keys, each optional: client_id, client_secret, username, password
# (username and password for partner_grant_type `password`). A missing key or Secret keeps the DB
# value. Empty name: no credentials from Kubernetes.
openg2pPartnerSecret:
  name: oan-a2c-openg2p-partner

siteSettingsJob:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  # Runs of the sync, 30 seconds apart, while the site-config job migrates.
  attempts: 20

frappe:
  image:
    # Set per environment. package_chart.py needs both keys to exist.
    repository: ""
    tag: ""

  # PostgreSQL runs outside the cluster. The create-site job reads the password of dbRootUser
  # from Secret oan-frappe-common-db, a copy of the one the frappe-common release creates.
  dbHost: ""
  dbPort: 5432
  dbExistingSecret: oan-frappe-common-db
  dbExistingSecretPasswordKey: password
  postgresql-sts:
    enabled: false

  siteConfig:
    enabled: true
    values:
      jwt_current_kid: v1
      jwt_private_keys:
        v1: keys/jwt_v1.pem
      jwt_self_registerable_roles:
      - A2C Bank Admin
      - A2C Farmer
    secretValues:
      # generate_consent_receipt signs consent receipts with it and throws without it.
      secret_key:
        secretName: oan-a2c-secret-key
        secretKey: secret_key
    files:
    # oan_auth_service refuses every login without it.
    - path: keys/jwt_v1.pem
      secretName: oan-a2c-jwt
      secretKey: jwt_v1.pem
    seed:
      userPasswordSecret:
        name: oan-a2c-seed

  # FRAPPE_STREAM_LOGGING sends frappe.logger output to stdout for the cluster log collector.
  # FRAPPE_SENTRY_DSN is optional: without the Secret, Sentry stays off.
  nginx:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  worker:
    gunicorn:
      envVars: &frappeEnv
      - name: FRAPPE_STREAM_LOGGING
        value: "1"
      - name: FRAPPE_SENTRY_DSN
        valueFrom:
          secretKeyRef:
            name: oan-a2c-sentry
            key: dsn
            optional: true
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    default:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    short:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    long:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    scheduler:
      envVars: *frappeEnv
  socketio:
    envVars: *frappeEnv
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  jobs:
    createSite:
      adminExistingSecret: oan-a2c-admin
      installApps:
      - oan_auth_service
      - oan_a2c
