{{- /*
Secrets the A2C site needs, generated once and reused on upgrade (lookup), as oan-frappe-common does
for the PostgreSQL password. Each one can be switched off with secrets.<name>.create=false to bring
your own Secret of the same name and keys.

  admin      key `password`     Frappe Administrator password (jobs.createSite.adminExistingSecret)
  secretKey  key `secret_key`   HMAC key that signs consent receipts
  jwt        key `jwt_v1.pem`   RSA private key that signs access tokens (oan_auth_service)

The Secrets are kept on uninstall (helm.sh/resource-policy: keep): losing the JWT key invalidates every
issued token, and the admin password and secret key belong to data that stays on the volume.
helm template and --dry-run cannot see the cluster, so they render fresh values; only a real install
or upgrade keeps the existing ones.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $admin := .Values.secrets.admin }}
{{- if $admin.create }}
{{- $existing := lookup "v1" "Secret" $ns $admin.name }}
{{- $value := randAlphaNum 24 }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $value = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $admin.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $value | quote }}
---
{{- end }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if $secretKey.create }}
{{- $existing := lookup "v1" "Secret" $ns $secretKey.name }}
{{- $value := randAlphaNum 48 }}
{{- if and $existing $existing.data (hasKey $existing.data "secret_key") }}
{{- $value = index $existing.data "secret_key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretKey.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret_key: {{ $value | quote }}
---
{{- end }}
{{- $jwt := .Values.secrets.jwt }}
{{- if $jwt.create }}
{{- $existing := lookup "v1" "Secret" $ns $jwt.name }}
{{- $pem := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "jwt_v1.pem") }}
{{- $pem = index $existing.data "jwt_v1.pem" | b64dec }}
{{- else }}
{{- $pem = genPrivateKey "rsa" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jwt.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt_v1.pem: |
{{ $pem | indent 4 }}
{{- end }}
