# Values for the oan-a2c-service chart (helm/oan-a2c-service).
# Target: the oan_dev k3s node, installed by the Jenkins stage "develop → oan_dev (helm)"
# (ci/deploy-helm-dev.sh). The same file runs a local single-node cluster (docs/a2c.md, "Local").
# Release `a2c`, namespace `a2c`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `<__version__>-develop.<build>` (locally: `develop`)
# - frappe.dbHost: set below, the shared PostgreSQL of the oan-frappe-common release (namespace frappe-common)

frappe:
  image:
    # Jenkinsfile ECR_REPO `oan/oan-a2c-service/a2c-service`. A local build tagged with this name
    # is used without a pull (pullPolicy IfNotPresent).
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/oan-a2c-service/a2c-service

  # ECR login for the image and the seed image. ci/deploy-helm-dev.sh refreshes it on every
  # deploy (the token lasts 12 hours); locally, create it by hand or drop this.
  imagePullSecrets:
    - name: ecr-pull-secret

  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  persistence:
    worker:
      # ReadWriteMany from the NFS server, see nfs-csi.yaml.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://a2c-service.development.oanstaging.com
    # Demo data. Build and push from oan-service-helm: seed/Dockerfile with SERVICE=a2c.
    seed:
      enabled: true
      image:
        repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/a2c-seed
        tag: demo-20261108

  # The central APISIX gateway runs in another cluster and reaches Frappe on this node port
  # (web.port in oan-a2c-gateway.yaml). Allow it in the node's security group from the
  # gateway cluster's addresses only.
  gatewayAccess:
    enabled: true
    web:
      nodePort: 30810

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777 (mountPermissions), so the
      # Frappe user can write it. The upstream root `chown -R` only races with Pods that
      # write into sites/ while the jobs run, and its failure fails the job.
      fixVolume: false
    createSite:
      siteName: a2c-service.development.oanstaging.com
