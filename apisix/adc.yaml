# A2C ADC config (adc lint|validate|diff|sync)
# Source Spec: OpenAgriNet Access to Credit (A2C) API v1.0.0
# Generated by generate_apisix_config_from_spec.py -- do not hand-edit;
# change the OpenAPI spec or TIER_OVERRIDES in kong/ and re-run.
services:
- name: oan-a2c-service-v1
  labels:
    app: oan-a2c
  upstream:
    scheme: http
    nodes:
    - host: ${OAN_A2C_UPSTREAM_HOST}
      port: 8080
      weight: 1
    pass_host: rewrite
    upstream_host: ${FRAPPE_SITE_NAME}
    timeout:
      connect: 5
      send: 20
      read: 20
    retries: 2
  plugins:
    cors:
      allow_origins: 'null'
      allow_origins_by_regex:
      - https?://localhost(:[0-9]+)?
      allow_methods: GET,POST,PATCH,PUT,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type,X-Request-Id,X-CSRF-Token
      allow_credential: true
      max_age: 3600
    client-control:
      max_body_size: 20971520
    proxy-rewrite:
      regex_uri:
      - ^/(v[0-9]+)/(.*)
      - /api/$1/$2
  routes:
  - name: oan-a2c-authenticated-core-bearer-delete
    description: Identity/profile/notifications -- any signed-in caller, low cost per call.
    labels:
      app: oan-a2c
      tier: authenticated-core
      auth: bearer
    uris:
    - /v1/notifications
    methods:
    - DELETE
    plugins:
      limit-count:
        rules:
        - count: 120
          time_window: 60
          key: $remote_addr:min
        - count: 4000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
  - name: oan-a2c-authenticated-core-bearer-get
    description: Identity/profile/notifications -- any signed-in caller, low cost per call.
    labels:
      app: oan-a2c
      tier: authenticated-core
      auth: bearer
    uris:
    - /v1/me
    - /v1/me/profile
    - /v1/notifications
    - /v1/taxonomy/attributes
    - /v1/taxonomy/categories
    - /v1/taxonomy/tags
    methods:
    - GET
    plugins:
      limit-count:
        rules:
        - count: 120
          time_window: 60
          key: $remote_addr:min
        - count: 4000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
  - name: oan-a2c-authenticated-core-bearer-patch
    description: Identity/profile/notifications -- any signed-in caller, low cost per call.
    labels:
      app: oan-a2c
      tier: authenticated-core
      auth: bearer
    uris:
    - /v1/me/password
    - /v1/me/profile
    - /v1/notifications/read
    methods:
    - PATCH
    plugins:
      limit-count:
        rules:
        - count: 120
          time_window: 60
          key: $remote_addr:min
        - count: 4000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
  - name: oan-a2c-authenticated-core-bearer-post
    description: Identity/profile/notifications -- any signed-in caller, low cost per call.
    labels:
      app: oan-a2c
      tier: authenticated-core
      auth: bearer
    uris:
