    description: Login/registration/password-recovery. Tight, IP-keyed, to blunt credential stuffing before
      it reaches Frappe's own lockout logic.
    labels:
      app: oan-a2c
      tier: public-auth
      auth: public
    uris:
    - /v1/auth/login
    - /v1/auth/password/forgot
    - /v1/auth/password/initial
    - /v1/auth/password/reset
    - /v1/auth/register
    - /v1/auth/token/refresh
    methods:
    - POST
    plugins:
      limit-count:
        rules:
        - count: 5
          time_window: 60
          key: $remote_addr:min
        - count: 30
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
