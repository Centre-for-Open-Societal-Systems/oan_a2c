  - name: oan-a2c-public-dashboards-dashboard-key-get
    description: 'Programme dashboard charts: aggregate-only reads by the OAN dashboards, the one consumer
      holding a dashboard key. It calls on behalf of every viewer and caches each chart for 15 minutes,
      so its steady load is low. Same number as RATE_LIMIT_PER_MINUTE in oan_a2c/api/v1/dashboard.py.'
    labels:
      app: oan-a2c
      tier: public-dashboards
      auth: dashboard-key
    uris:
    - /v1/charts/:chart_id
    methods:
    - GET
    plugins:
      limit-count:
        rules:
        - count: 600
          time_window: 60
          key: $consumer_name:min
        - count: 20000
          time_window: 3600
          key: $consumer_name:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
      key-auth:
        header: apikey
        hide_credentials: true
      consumer-restriction:
        whitelist:
        - a2c-oan-dashboards
  - name: oan-a2c-uploads-bearer-post
    description: Document upload endpoints -- expensive, low-frequency by nature. Paired with request-size-limiting;
      see README for the pre-signed-URL migration note.
    labels:
      app: oan-a2c
      tier: uploads
      auth: bearer
    uris:
