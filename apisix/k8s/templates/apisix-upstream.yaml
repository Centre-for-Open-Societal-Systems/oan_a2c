# A2C APISIX Ingress Controller resources
# Source Spec: OpenAgriNet Access to Credit (A2C) API v1.0.0
# Generated by generate_apisix_config_from_spec.py -- do not hand-edit;
# change the OpenAPI spec or TIER_OVERRIDES in kong/ and re-run.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: {{ required "web.serviceName is required" .Values.web.serviceName | quote }}
  labels:
    app: oan-a2c
spec:
{{- if .Values.web.externalHosts }}
  externalNodes:
{{- range .Values.web.externalHosts }}
  - type: Domain
    name: {{ . | quote }}
    port: {{ $.Values.web.port }}
{{- end }}
{{- with .Values.web.healthCheck }}
  healthCheck:
{{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
  scheme: http
  passHost: rewrite
  upstreamHost: {{ required "siteName is required" .Values.siteName | quote }}
  retries: 2
  timeout:
    connect: 5s
    send: 20s
    read: 20s
